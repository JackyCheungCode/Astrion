name: Astrion web and database CI

on:
  push:
    branches:
      - main
      - feature/ai-acquisition-frontend
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astrion-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Build web app
        run: npm run build --prefix apps/web

  database-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Run database schema and policy tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
