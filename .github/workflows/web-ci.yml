name: Astrion web CI

on:
  push:
    branches:
      - main
      - feature/ai-acquisition-frontend
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astrion-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Build web app
        run: npm run build --prefix apps/web

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check acquisition Edge Function
        run: deno check supabase/functions/acquisition-research/index.ts
